<!DOCTYPE html>
<html lang="it">

<!-- HEAD -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Impostazione del Titolo della Pagina -->
    <title>Match | MeetYourMatch</title>

    <!-- Impostazione del Favicon della Pagina -->
    <link rel="icon" href="asset/favicon.ico" type="image/x-icon">

    <!-- Inclusione del framework CSS Bootstrap da un CDN (Content Delivery Network) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Inclusione di file CSS -->
    <link rel="stylesheet" href="../css/match.css">

    <!-- Inclusione di file JavaScript -->
    <script src="js/match.js" defer></script>
</head>

<!-- BODY -->
<body>

    <!-- Header -->
    <header class="fixed-top bg-white border-bottom">
        <div class="container py-2">
            <a href="home.html" class="text-decoration-none">
                <h1 class="mb-0 fs-5 text-dark fw-bold">Meet your match</h1>
            </a>
        </div>
    </header>
    
    <div class="match-cover">
        <img src="asset/banner_palla.png" alt="Match Cover" class="img-fluid w-100">
    </div>

    <!-- Main -->
    <main class="container pt-5" style="max-width: 1000px;">
        <nav class="my-4 text-center">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a href="home.html" class="text-purple">Home</a></li>
                <li class="breadcrumb-item active text-purple" id="breadcrumb-title">Dettagli Match</li>
            </ol>
        </nav>

        <div id="match-details" class="row g-3 mb-4">
            <!-- contenuto caricato dinamicamente -->
        </div>

        <div class="d-flex justify-content-end gap-3">
            <button class="btn btn-secondary py-2 px-4">Aggiungi alla wishlist</button>
            <button class="btn btn-purple py-2 px-4">Chiedi di partecipare</button>
        </div>
    </main>

    <!-- Footer -->
    <footer class="fixed-bottom bg-white border-top">
        <div class="container py-2">
            <p class="text-center mb-0 text-dark">iMatchfinder 2024©</p>
        </div>
    </footer>
</body>
</html>
