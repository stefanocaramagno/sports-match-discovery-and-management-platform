<!DOCTYPE html>
<html lang="it">

<!-- HEAD -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Impostazione del Titolo della Pagina -->
    <title>Match (Owner) | MeetYourMatch</title>

    <!-- Impostazione della Favicon -->
    <link rel="icon" href="asset/favicon.ico" type="image/x-icon">

    <!-- Inclusione del framework CSS Bootstrap da un CDN (Content Delivery Network) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Inclusione di file CSS -->
    <link rel="stylesheet" href="css/match_owner.css">
</head>

<!-- BODY -->
<body>

    <!-- Header -->
    <header class="fixed-top bg-white border-bottom">
        <div class="container py-2">
            <a href="home.html" class="text-decoration-none">
                <h1 class="mb-0 fs-5 text-dark fw-bold">Meet your match</h1>
            </a>
        </div>
    </header>

    <div class="match-cover">
        <img src="asset/banner_palla.png" alt="Match Cover" class="img-fluid w-100">
    </div>

    <!-- Main -->
    <main class="container pt-5" style="max-width: 1000px;">
        <nav class="my-4 text-center">
            <ol class="breadcrumb justify-content-center">
                <li class="breadcrumb-item"><a href="home.html" class="text-purple">Home</a></li>
                <li class="breadcrumb-item active text-purple" aria-current="page">Lentini VS Siracusa</li>
            </ol>
        </nav>

        <div class="row g-3 mb-5">
            <div class="col-md-6">
                <div class="p-3 border rounded">
                    <p class="text-muted mb-1">Titolo match</p>
                    <h5 class="fw-bold">Lentini VS Siracusa</h5>
                </div>
            </div>
            <div class="col-md-6">
                <div class="p-3 border rounded">
                    <p class="text-muted mb-1">Sport</p>
                    <h5 class="fw-bold">Calcio</h5>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 border rounded">
                    <p class="text-muted mb-1">Data</p>
                    <h5 class="fw-bold">10/12/2024</h5>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 border rounded">
                    <p class="text-muted mb-1">Ora</p>
                    <h5 class="fw-bold">18:30</h5>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 border rounded">
                    <p class="text-muted mb-1">Difficoltà</p>
                    <h5 class="fw-bold">Media</h5>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 border rounded">
                    <p class="text-muted mb-1">Indirizzo</p>
                    <h5 class="fw-bold">Siracusa Stadium</h5>
                </div>
            </div>
        </div>

        <section class="waitlist mt-5">
            <h3 class="fw-bold mb-3">Lista d'attesa</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Nome</th>
                        <th scope="col" class="me-3">Cognome</th>
                        <th scope="col">Azione</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <th scope="row">1</th>
                        <td>Mark</td>
                        <td class="me-3">Otto</td>
                        <td>
                            <button class="btn btn-secondary btn-sm">Rifiuta</button>
                            <button class="btn btn-purple btn-sm">Accetta</button>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">2</th>
                        <td>Jacob</td>
                        <td class="me-3">Thornton</td>
                        <td>
                            <button class="btn btn-secondary btn-sm">Rifiuta</button>
                            <button class="btn btn-purple btn-sm">Accetta</button>
                        </td>
                    </tr>
                    <tr>
                        <th scope="row">3</th>
                        <td>Larry</td>
                        <td class="me-3">the Bird</td>
                        <td>
                            <button class="btn btn-secondary btn-sm">Rifiuta</button>
                            <button class="btn btn-purple btn-sm">Accetta</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- Footer -->
    <footer class="fixed-bottom bg-white border-top">
        <div class="container py-2">
            <p class="text-center mb-0 text-dark">iMatchfinder 2024©</p>
        </div>
    </footer>
</body>
</html>
